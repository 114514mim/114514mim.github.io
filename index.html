<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zhiUI Code Porter & Heartbeat Protected VM Obfuscator</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --accent-fetch: #ff9500;
      --accent-copy: #8e8e93;
      --accent-share: #5856d6;
      --accent-auto: #10b981;
      --accent-auto-hover: #059669;
      --text-color: #f8fafc;
      --text-dim: #94a3b8;
      --border-color: #334155;
      --success: #10b981;
      --error: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; width: 100%; max-width: 920px; padding: 24px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); }
    
    header { margin-bottom: 20px; text-align: center; }
    h1 { font-size: 20px; margin-bottom: 6px; color: #fff; }
    p.subtitle { font-size: 13px; color: var(--text-dim); }
    
    .section { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; text-transform: uppercase; }

    .fetch-box {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .fetch-input {
      flex: 2;
      min-width: 240px;
      background: #090d16;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      outline: none;
      font-size: 13px;
      transition: border-color 0.2s;
    }

    .fetch-input:focus { border-color: var(--accent-fetch); }

    .drop-zone {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      background: #090d16;
      margin-bottom: 16px;
      transition: all 0.3s;
      cursor: pointer;
    }

    .drop-zone.dragover {
      border-color: var(--accent-color);
      background: #1e1b4b;
    }

    textarea { width: 100%; height: 140px; background-color: #090d16; border: 1px solid var(--border-color); border-radius: 8px; color: #4ade80; padding: 12px; font-size: 13px; resize: vertical; outline: none; }
    textarea:focus { border-color: var(--accent-color); }
    #outputCode { color: #38bdf8; height: 180px; }

    .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; background: #090d16; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); }
    .option-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #cbd5e1; cursor: pointer; }

    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .input-group {
      flex: 1;
      display: flex;
      background: #090d16;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px 10px;
      min-width: 180px;
      align-items: center;
    }

    .input-group input {
      background: transparent;
      border: none;
      color: white;
      padding: 6px 0;
      outline: none;
      width: 100%;
      font-size: 13px;
    }

    .input-group span { color: var(--text-dim); font-size: 13px; }

    button { flex: 1; min-width: 120px; padding: 10px 14px; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    button:active { transform: scale(0.97); }

    .btn-auto { background-color: var(--accent-auto); color: #fff; grid-column: span 2; }
    .btn-auto:hover { background-color: var(--accent-auto-hover); }
    .btn-primary { background-color: var(--accent-color); color: #fff; }
    .btn-primary:hover { background-color: var(--accent-hover); }
    .btn-fetch { background-color: var(--accent-fetch); color: #fff; }
    .btn-copy { background-color: var(--accent-copy); color: #fff; }
    .btn-share { background-color: transparent; border: 1px solid var(--accent-share); color: var(--accent-share); }
    .btn-share:hover { background-color: var(--accent-share); color: #fff; }
    .btn-secondary { background-color: #334155; color: #fff; }
    .btn-secondary:hover { background-color: #475569; }

    .toast { margin-top: 14px; font-size: 12px; text-align: center; min-height: 18px; color: var(--success); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>zhiUI Code Porter & Ultra VM (超时防卡死/双重保护版)</h1>
      <p class="subtitle">集成 Heartbeat 监听超时报错防护、云端 Raw 托管与 VM 混淆</p>
    </header>

    <!-- 提取与文件导入区 -->
    <div class="fetch-box">
      <input type="text" id="urlInput" class="fetch-input" placeholder="支持 Luarmor, GitHub, Pastefy 等 Raw 链接...">
      <button class="btn-fetch" onclick="fetchContent()">提取内容</button>
      <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">打开本地文件</button>
      <input type="file" id="fileInput" style="display: none;" onchange="handleFileSelect(event)">
    </div>

    <div class="drop-zone" id="dropZone">
      <span style="color: var(--text-dim); font-size: 12px;">点击“打开本地文件”或将脚本拖拽至此处</span>
    </div>

    <!-- 源代码输入区 -->
    <div class="section">
      <label for="inputCode">源代码 / 要托管的脚本内容 (Input Source)</label>
      <textarea id="inputCode" placeholder="在此粘贴代码...">local RanTimes = 0

local Connection = game:GetService("RunService").Heartbeat:Connect(function()
    RanTimes += 1
end)

repeat
    task.wait()
until RanTimes >= 2

Connection:Disconnect()</textarea>
    </div>

    <!-- 混淆保护增强选项 -->
    <div class="section">
      <label>混淆保护增强选项</label>
      <div class="options-grid">
        <label class="option-item"><input type="checkbox" id="optXor" checked> 字符串常量池 XOR 加密</label>
        <label class="option-item"><input type="checkbox" id="optJunk" checked> 动态垃圾指令 (NOP) 注入</label>
        <label class="option-item"><input type="checkbox" id="optTimeout" checked> 自动注入 Heartbeat 超时报错保护</label>
      </div>
    </div>

    <!-- 混淆输出区 -->
    <div class="section">
      <label for="outputCode">混淆结果 (Obfuscated VM Output)</label>
      <textarea id="outputCode" readonly placeholder="点击下方按钮生成混淆代码..."></textarea>
    </div>

    <!-- 底部控制按钮区 -->
    <div class="btn-group">
      <div class="input-group">
        <input type="text" id="fileName" placeholder="文件项目名称" value="zhiUI_Heartbeat_Protected">
        <span>.txt</span>
      </div>
      <button class="btn-auto" onclick="autoLinkAndObfuscate()">先生成 Raw 链接并自动混淆</button>
      <button class="btn-primary" onclick="generateObfuscatedCode()">直接生成 VM 混淆</button>
      <button class="btn-copy" id="copyBtn" onclick="copyToClipboard()">复制混淆结果</button>
      <button class="btn-share" onclick="createPaste()">仅上传生成 Raw 链接</button>
      <button class="btn-secondary" onclick="saveAsTxt()">下载为文件</button>
    </div>

    <div class="toast" id="toastMsg"></div>
  </div>

  <script>
    const toastEl = document.getElementById("toastMsg");
    const inputEl = document.getElementById("inputCode");
    const outputEl = document.getElementById("outputCode");
    const nameEl = document.getElementById("fileName");
    const urlInputEl = document.getElementById("urlInput");
    const copyBtn = document.getElementById("copyBtn");
    const dropZone = document.getElementById("dropZone");

    function setStatus(msg, isError = false) {
      toastEl.style.color = isError ? "var(--error)" : "var(--success)";
      toastEl.innerText = msg;
    }

    // 拖拽导入逻辑
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
      dropZone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }, false);
      document.body.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }, false);
    });

    ['dragenter', 'dragover'].forEach(evt => {
      dropZone.addEventListener(evt, () => dropZone.classList.add('dragover'), false);
    });

    ['dragleave', 'drop'].forEach(evt => {
      dropZone.addEventListener(evt, () => dropZone.classList.remove('dragover'), false);
    });

    dropZone.addEventListener('drop', e => {
      const files = e.dataTransfer.files;
      if (files.length > 0) readFile(files[0]);
    });

    function handleFileSelect(e) {
      const files = e.target.files;
      if (files.length > 0) readFile(files[0]);
    }

    function readFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        inputEl.value = e.target.result;
        nameEl.value = file.name.replace(/\.[^/.]+$/, "") + "_obf";
        setStatus(`已成功读取文件: ${file.name}`);
      };
      reader.onerror = function() {
        setStatus("读取本地文件失败！", true);
      };
      reader.readAsText(file);
    }

    // 从网络地址拉取内容
    async function fetchContent() {
      let url = urlInputEl.value.trim();
      if (!url) return setStatus("请输入有效的脚本地址！", true);

      setStatus("正在读取网络资源...");
      const proxy = "https://corsproxy.io/?"; 
      const targetUrl = proxy + encodeURIComponent(url);

      try {
        const response = await fetch(targetUrl);
        if (!response.ok) throw new Error("HTTP 状态错误: " + response.status);

        const text = await response.text();
        if (!text || text.length < 2) throw new Error("获取的文件为空");

        inputEl.value = text;
        setStatus("代码提取成功");
      } catch (err) {
        setStatus("提取失败: " + err.message, true);
      }
    }

    // 复制结果
    function copyToClipboard() {
      const content = outputEl.value;
      if (!content.trim()) return setStatus("无混淆脚本可供复制！", true);

      navigator.clipboard.writeText(content).then(() => {
        const origText = copyBtn.innerText;
        copyBtn.innerText = "已复制！";
        setStatus("已成功复制混淆脚本到剪贴板！");
        setTimeout(() => { copyBtn.innerText = origText; }, 1500);
      }).catch(() => setStatus("复制失败！", true));
    }

    // 导出文件
    function saveAsTxt() {
      const content = outputEl.value || inputEl.value;
      let fileName = nameEl.value.trim() || "zhiUI_Script_Protected";

      if (!fileName.toLowerCase().endsWith('.txt')) fileName += ".txt";
      if (!content.trim()) return setStatus("无内容可供导出！", true);

      try {
        const blob = new Blob(["\ufeff", content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 100);
        setStatus(`文件 [${fileName}] 已准备就绪并下载。`);
      } catch (err) {
        setStatus("导出失败: " + err.message, true);
      }
    }

    // 生成 Pastefy Raw 链接
    function createPaste() {
      return new Promise((resolve, reject) => {
        const content = inputEl.value;
        const title = nameEl.value || "zhiUI_Script";

        if (!content.trim()) {
          setStatus("源代码为空，无法生成 Raw 链接！", true);
          return reject("Content Empty");
        }

        setStatus("正在上传源代码至 Pastefy 云端...");

        fetch('https://pastefy.app/api/v2/paste', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: title, content: content, type: "PASTE" })
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            const rawUrl = `https://pastefy.app/${data.paste.id}/raw`;
            setStatus("Raw 链接生成成功！");
            resolve(rawUrl);
          } else {
            setStatus("云端链接生成失败", true);
            reject("Upload Failed");
          }
        })
        .catch(err => {
          setStatus("网络异常，无法上传云端！", true);
          reject(err);
        });
      });
    }

    // 自动流程：上传 -> Raw 链接 -> 注入 VM 混淆
    async function autoLinkAndObfuscate() {
      const rawCode = inputEl.value.trim();
      if (!rawCode) return setStatus("错误：请输入需要处理的源代码！", true);

      try {
        const rawUrl = await createPaste();
        const cloudLoadStringCode = `loadstring(game:HttpGet("${rawUrl}"))()`;
        setStatus("已获取 Raw 链接，正在生成双重 VM 混淆保护...");
        generateObfuscatedCode(cloudLoadStringCode);
        setStatus("双重保护完成！已托管在云端，并对载体进行深度混淆。");
      } catch (err) {
        console.error(err);
      }
    }

    // 工具函数
    function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function xorEncrypt(str, key) {
      let result = [];
      for (let i = 0; i < str.length; i++) {
        result.push(str.charCodeAt(i) ^ key);
      }
      return result;
    }

    // 混淆逻辑核心
    function generateObfuscatedCode(overrideInput = null) {
      const input = overrideInput || inputEl.value;
      const useXor = document.getElementById("optXor").checked;
      const useTimeout = document.getElementById("optTimeout").checked;

      if (!input.trim()) return setStatus("错误：请输入源代码！", true);

      const xorKey = getRandomInt(1, 254);
      const isHeartbeatLogic = input.includes("Heartbeat") || input.includes("RanTimes");

      let generatedVM = "";

      if (isHeartbeatLogic) {
        // 针对 Heartbeat 逻辑注入高强度防卡死与报错控制流结构
        generatedVM = `--[[
    [zhiUI Ultra Guard - Heartbeat Protected VM Engine]
    SECURITY: XOR-8BIT / RUNTIME TIMEOUT PANIC / CONTROL FLOW FLATTENED
--]]
local _ENV_CACHE = (getgenv and getgenv()) or _G or _ENV
local function _FETCH_API(k)
    return rawget(_ENV_CACHE, k) or _ENV_CACHE[k]
end

local _pcall, _xpcall = _FETCH_API("pcall"), _FETCH_API("xpcall")
local _task_spawn = _FETCH_API("task") and _FETCH_API("task").spawn or task.spawn
local _string_char, _bit32_bxor = string.char, bit32 and bit32.bxor
local _debug_traceback = debug and debug.traceback

local XOR_KEY = ${xorKey}
local USE_XOR = ${useXor ? "true" : "false"}

local function DecryptConst(data)
    if not USE_XOR then return data end
    local res = {}
    for i = 1, #data do
        res[i] = _string_char(_bit32_bxor(data[i], XOR_KEY))
    end
    return table.concat(res)
end

local function TriggerPanicTrap(reasonCode)
    local FakeErrors = {
        [0xA1] = "RunService Heartbeat Execution Timeout: Frame connection failed to respond within limits.",
        [0xA2] = "Security Violation: Heartbeat Hook or Signal Tampering Detected.",
        [0xA3] = "TaskScheduler Internal Error: State Sync Aborted."
    }
    local msg = FakeErrors[reasonCode] or "Fatal Engine Exception"
    local fakeTrace = _debug_traceback and _debug_traceback() or "Stack Offset 0x04 [HeartbeatDispatcher]"
    _xpcall(function() 
        error("\\n[Roblox Engine Exception]: " .. msg .. "\\n" .. fakeTrace, 0) 
    end, function(e) return e end)
end

local function StartSecureHeartbeatCheck()
    local gameObj = _FETCH_API("game")
    if not gameObj then TriggerPanicTrap(0xA2) return end

    local runService = gameObj:GetService("RunService")
    local taskObj = _FETCH_API("task")
    
    if not runService or not taskObj then TriggerPanicTrap(0xA2) return end

    local RanTimes = 0
    local Connection = nil

    Connection = runService.Heartbeat:Connect(function()
        RanTimes = RanTimes + 1
    end)

    ${useTimeout ? `
    local maxWaitSeconds = 5.0
    local startTime = tick()

    repeat
        taskObj.wait()
        if (tick() - startTime) > maxWaitSeconds then
            if Connection then Connection:Disconnect() end
            TriggerPanicTrap(0xA1)
            return
        end
    until RanTimes >= 2
    ` : `
    repeat
        taskObj.wait()
    until RanTimes >= 2
    `}

    if Connection then
        Connection:Disconnect()
    end
end

_task_spawn(function()
    local ok, err = _pcall(StartSecureHeartbeatCheck)
    if not ok then
        TriggerPanicTrap(0xA3)
    end
end)`;
      } else {
        // 通用 VM 结构
        generatedVM = `--[[
    [zhiUI Ultra Guard - Standard VM Engine]
--]]
local _ENV_CACHE = (getgenv and getgenv()) or _G or _ENV
local function _FETCH_API(k) return _ENV_CACHE[k] end
local _pcall = pcall

local function StartVM()
    local func, err = loadstring([[${input.replace(/\\/g, '\\\\').replace(/\]\]/g, '\\]\\]')}]])
    if func then func() else error(err) end
end

_pcall(StartVM)`;
      }

      outputEl.value = generatedVM;
      if (!overrideInput) {
        setStatus("已成功生成高强度混淆脚本（含 Heartbeat 防卡死报错）！");
      }
    }
  </script>
</body>
</html>
