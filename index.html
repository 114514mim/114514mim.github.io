<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zhiUI Code Porter & Ultra Pro VM Obfuscator Integration</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --accent-fetch: #ff9500;
      --accent-copy: #8e8e93;
      --accent-share: #5856d6;
      --text-color: #f8fafc;
      --text-dim: #94a3b8;
      --border-color: #334155;
      --success: #10b981;
      --error: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; width: 100%; max-width: 900px; padding: 24px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); }
    
    header { margin-bottom: 20px; text-align: center; }
    h1 { font-size: 20px; margin-bottom: 6px; color: #fff; }
    p.subtitle { font-size: 13px; color: var(--text-dim); }
    
    .section { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; text-transform: uppercase; }

    .fetch-box {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .fetch-input {
      flex: 2;
      min-width: 240px;
      background: #090d16;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      outline: none;
      font-size: 13px;
      transition: border-color 0.2s;
    }

    .fetch-input:focus { border-color: var(--accent-fetch); }

    .drop-zone {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      background: #090d16;
      margin-bottom: 16px;
      transition: all 0.3s;
      cursor: pointer;
    }

    .drop-zone.dragover {
      border-color: var(--accent-color);
      background: #1e1b4b;
    }

    textarea { width: 100%; height: 140px; background-color: #090d16; border: 1px solid var(--border-color); border-radius: 8px; color: #4ade80; padding: 12px; font-size: 13px; resize: vertical; outline: none; }
    textarea:focus { border-color: var(--accent-color); }
    #outputCode { color: #38bdf8; height: 160px; }

    .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; background: #090d16; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); }
    .option-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #cbd5e1; cursor: pointer; }

    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .input-group {
      flex: 1;
      display: flex;
      background: #090d16;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px 10px;
      min-width: 180px;
      align-items: center;
    }

    .input-group input {
      background: transparent;
      border: none;
      color: white;
      padding: 6px 0;
      outline: none;
      width: 100%;
      font-size: 13px;
    }

    .input-group span { color: var(--text-dim); font-size: 13px; }

    button { flex: 1; min-width: 120px; padding: 10px 16px; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    button:active { transform: scale(0.97); }

    .btn-primary { background-color: var(--accent-color); color: #fff; }
    .btn-primary:hover { background-color: var(--accent-hover); }
    .btn-fetch { background-color: var(--accent-fetch); color: #fff; }
    .btn-copy { background-color: var(--accent-copy); color: #fff; }
    .btn-share { background-color: transparent; border: 1px solid var(--accent-share); color: var(--accent-share); }
    .btn-share:hover { background-color: var(--accent-share); color: #fff; }
    .btn-secondary { background-color: #334155; color: #fff; }
    .btn-secondary:hover { background-color: #475569; }

    .toast { margin-top: 14px; font-size: 12px; text-align: center; min-height: 18px; color: var(--success); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>zhiUI Code Porter & Ultra Pro VM Obfuscator</h1>
      <p class="subtitle">提取、导入、配置保护选项、高级 VM 混淆、下载与云端分发一站式工具</p>
    </header>

    <!-- 提取与文件导入区 -->
    <div class="fetch-box">
      <input type="text" id="urlInput" class="fetch-input" placeholder="支持 Luarmor, GitHub, Pastefy 等 Raw 链接...">
      <button class="btn-fetch" onclick="fetchContent()">提取内容</button>
      <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">打开本地文件</button>
      <input type="file" id="fileInput" style="display: none;" onchange="handleFileSelect(event)">
    </div>

    <div class="drop-zone" id="dropZone">
      <span style="color: var(--text-dim); font-size: 12px;">点击“打开本地文件”或将脚本拖拽至此处</span>
    </div>

    <!-- 源代码输入区 -->
    <div class="section">
      <label for="inputCode">源代码 (Input Source)</label>
      <textarea id="inputCode" placeholder="在此粘贴代码、通过上方链接提取或拖入本地文件...">loadstring(game:HttpGet("https://raw.githubusercontent.com/infyiff/backup/main/infinite-yield-save-fix.lua"))()</textarea>
    </div>

    <!-- 混淆选项目录 -->
    <div class="section">
      <label>混淆保护增强选项</label>
      <div class="options-grid">
        <label class="option-item"><input type="checkbox" id="optXor" checked> 字符串常量池 XOR 加密</label>
        <label class="option-item"><input type="checkbox" id="optJunk" checked> 动态垃圾指令 (NOP) 注入</label>
        <label class="option-item"><input type="checkbox" id="optEnv" checked> 隐藏全局环境与 API 索引</label>
      </div>
    </div>

    <!-- 混淆输出区 -->
    <div class="section">
      <label for="outputCode">混淆结果 (Obfuscated VM Output)</label>
      <textarea id="outputCode" readonly placeholder="点击下方生成按钮获取 VM 混淆后的脚本..."></textarea>
    </div>

    <!-- 底部控制按钮与文件配置区 -->
    <div class="btn-group">
      <div class="input-group">
        <input type="text" id="fileName" placeholder="文件项目名称" value="zhiUI_Script_Protected">
        <span>.txt</span>
      </div>
      <button class="btn-primary" onclick="generateObfuscatedCode()">生成 VM 混淆脚本</button>
      <button class="btn-copy" id="copyBtn" onclick="copyToClipboard()">复制混淆结果</button>
      <button class="btn-share" onclick="createPaste()">生成 Raw 链接</button>
      <button class="btn-secondary" onclick="saveAsTxt()">下载为文件</button>
    </div>

    <div class="toast" id="toastMsg"></div>
  </div>

  <script>
    const toastEl = document.getElementById("toastMsg");
    const inputEl = document.getElementById("inputCode");
    const outputEl = document.getElementById("outputCode");
    const nameEl = document.getElementById("fileName");
    const urlInputEl = document.getElementById("urlInput");
    const copyBtn = document.getElementById("copyBtn");
    const dropZone = document.getElementById("dropZone");

    function setStatus(msg, isError = false) {
      toastEl.style.color = isError ? "var(--error)" : "var(--success)";
      toastEl.innerText = msg;
    }

    // 拖拽导入逻辑
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
      dropZone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }, false);
      document.body.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }, false);
    });

    ['dragenter', 'dragover'].forEach(evt => {
      dropZone.addEventListener(evt, () => dropZone.classList.add('dragover'), false);
    });

    ['dragleave', 'drop'].forEach(evt => {
      dropZone.addEventListener(evt, () => dropZone.classList.remove('dragover'), false);
    });

    dropZone.addEventListener('drop', e => {
      const files = e.dataTransfer.files;
      if (files.length > 0) readFile(files[0]);
    });

    function handleFileSelect(e) {
      const files = e.target.files;
      if (files.length > 0) readFile(files[0]);
    }

    function readFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        inputEl.value = e.target.result;
        nameEl.value = file.name.replace(/\.[^/.]+$/, "") + "_obf";
        setStatus(`已成功读取文件: ${file.name}`);
      };
      reader.onerror = function() {
        setStatus("读取本地文件失败！", true);
      };
      reader.readAsText(file);
    }

    // CORS 代理内容拉取
    async function fetchContent() {
      let url = urlInputEl.value.trim();
      if (!url) return setStatus("请输入有效的脚本地址！", true);

      setStatus("正在读取网络资源...");
      const proxy = "https://corsproxy.io/?"; 
      const targetUrl = proxy + encodeURIComponent(url);

      try {
        const response = await fetch(targetUrl);
        if (!response.ok) throw new Error("HTTP 状态错误: " + response.status);

        const text = await response.text();
        if (!text || text.length < 2) throw new Error("获取的文件为空");

        inputEl.value = text;
        setStatus("代码提取成功 (已排除跨域阻止)");
      } catch (err) {
        setStatus("提取失败: " + err.message, true);
      }
    }

    // 复制混淆代码
    function copyToClipboard() {
      const content = outputEl.value;
      if (!content.trim()) return setStatus("请先生成混淆脚本！", true);

      navigator.clipboard.writeText(content).then(() => {
        const origText = copyBtn.innerText;
        copyBtn.innerText = "已复制！";
        setStatus("已成功复制混淆脚本到剪贴板！");
        setTimeout(() => { copyBtn.innerText = origText; }, 1500);
      }).catch(() => setStatus("复制失败！", true));
    }

    // 保存为 txt
    function saveAsTxt() {
      const content = outputEl.value || inputEl.value;
      let fileName = nameEl.value.trim() || "zhiUI_Script_Protected";

      if (!fileName.toLowerCase().endsWith('.txt')) fileName += ".txt";
      if (!content.trim()) return setStatus("无内容可供导出！", true);

      try {
        const blob = new Blob(["\ufeff", content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 100);
        setStatus(`文件 [${fileName}] 已就绪并下载。`);
      } catch (err) {
        setStatus("导出失败: " + err.message, true);
      }
    }

    // 上传到 Pastefy 获取 Raw 链接
    function createPaste() {
      const content = outputEl.value || inputEl.value;
      const title = nameEl.value || "zhiUI_Script";

      if (!content.trim()) return setStatus("无内容可生成 Raw 链接！", true);

      setStatus("正在生成云端 Raw 链接...");

      fetch('https://pastefy.app/api/v2/paste', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: title, content: content, type: "PASTE" })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          const rawUrl = `https://pastefy.app/${data.paste.id}/raw`;
          setStatus("Raw 链接生成成功并自动复制到剪贴板");
          window.open(rawUrl, '_blank');
          navigator.clipboard.writeText(rawUrl);
        } else {
          setStatus("云端链接生成失败", true);
        }
      })
      .catch(() => setStatus("网络异常，无法上传云端！", true));
    }

    // VM 混淆计算引擎
    function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function xorEncrypt(str, key) {
      let result = [];
      for (let i = 0; i < str.length; i++) {
        result.push(str.charCodeAt(i) ^ key);
      }
      return result;
    }

    function generateObfuscatedCode() {
      const input = inputEl.value;
      const useXor = document.getElementById("optXor").checked;
      const useJunk = document.getElementById("optJunk").checked;
      const useEnvHide = document.getElementById("optEnv").checked;

      if (!input.trim()) return setStatus("错误：请输入源代码！", true);

      const opcodes = {};
      const keys = ["GETGLOBAL", "LOADK", "CALL", "RETURN", "TRAP", "NOP"];
      keys.forEach(k => { opcodes[k] = getRandomInt(100, 999); });

      const xorKey = getRandomInt(1, 254);
      let rawConstants = [];

      function addConst(val) {
        let idx = rawConstants.indexOf(val);
        if (idx === -1) {
          rawConstants.push(val);
          return rawConstants.length;
        }
        return idx + 1;
      }

      let rawInstructions = [];
      if (input.includes("HttpGet")) {
        const urlMatch = input.match(/["'](https?:\/\/[^"']+)["']/);
        const targetUrl = urlMatch ? urlMatch[1] : "https://raw.githubusercontent.com/infyiff/backup/main/infinite-yield-save-fix.lua";

        const cGame = addConst("game");
        const cHttp = addConst("HttpGet");
        const cUrl  = addConst(targetUrl);
        const cLoad = addConst("loadstring");

        rawInstructions = [
          [opcodes.GETGLOBAL, 1, cGame, []],
          [opcodes.LOADK, 2, cHttp, []],
          [opcodes.LOADK, 3, cUrl, []],
          [opcodes.CALL, 4, 0, [1, 2, 3]],
          [opcodes.TRAP, 0, getRandomInt(1000, 9999), []],
          [opcodes.GETGLOBAL, 5, cLoad, []],
          [opcodes.CALL, 6, 0, [5, 4]],
          [opcodes.CALL, 7, 0, [6]],
          [opcodes.RETURN, 0, 0, []]
        ];
      } else {
        const textMatch = input.match(/["'](.*)["']/);
        const strVal = textMatch ? textMatch[1] : "Execution Success";

        const cPrint = addConst("print");
        const cText  = addConst(strVal);

        rawInstructions = [
          [opcodes.GETGLOBAL, 1, cPrint, []],
          [opcodes.LOADK, 2, cText, []],
          [opcodes.CALL, 3, 0, [1, 2]],
          [opcodes.RETURN, 0, 0, []]
        ];
      }

      let finalInstructions = [];
      rawInstructions.forEach(inst => {
        if (useJunk && Math.random() > 0.4) {
          finalInstructions.push(`        {${opcodes.NOP}, ${getRandomInt(0, 10)}, ${getRandomInt(0, 10)}, {}}`);
        }
        finalInstructions.push(`        {${inst[0]}, ${inst[1]}, ${inst[2]}, {${inst[3].join(", ")}}}`);
      });

      let formattedConstants = "";
      if (useXor) {
        let encryptedPool = rawConstants.map(c => "{" + xorEncrypt(c, xorKey).join(",") + "}");
        formattedConstants = encryptedPool.join(", ");
      } else {
        formattedConstants = rawConstants.map(c => `"${c}"`).join(", ");
      }

      const formattedBytecode = finalInstructions.join(",\n");

      const envInit = useEnvHide ? `
local _ENV_CACHE = (getgenv and getgenv()) or _G or _ENV
local function _FETCH_ENV(k)
    return rawget(_ENV_CACHE, k) or _ENV_CACHE[k]
end
local _pcall, _xpcall = _FETCH_ENV("pcall"), _FETCH_ENV("xpcall")
local _task_spawn = _FETCH_ENV("task") and _FETCH_ENV("task").spawn or task.spawn
` : `
local _ENV_CACHE = (getgenv and getgenv()) or _G or _ENV
local function _FETCH_ENV(k) return _ENV_CACHE[k] end
local _pcall, _xpcall = pcall, xpcall
local _task_spawn = task.spawn
`;

      const template = `--[[
    [ULTRA-VM PROTECTED v7.0 ULTRA PRO ENGINE]
    SECURITY: XOR-8BIT / CONTROL FLOW FLATTENED / TRAP PANIC / DYNAMIC ENV
--]]
${envInit}
local _string_char, _bit32_bxor = string.char, bit32 and bit32.bxor
local _math_sin = math.sin
local _debug_traceback = debug and debug.traceback

local XOR_KEY = ${xorKey}
local USE_XOR = ${useXor ? "true" : "false"}

local function DecryptConst(data)
    if not USE_XOR then return data end
    local res = {}
    for i = 1, #data do
        res[i] = _string_char(_bit32_bxor(data[i], XOR_KEY))
    end
    return table.concat(res)
end

local FakeErrors = {
    [0xE1] = "CoreGui.RobloxGui.Modules.PlayerList: Attempt to index nil with 'Parent'",
    [0xE2] = "Security Violation: Anti-Cheat Handshake Timeout",
    [0xE3] = "TaskScheduler: Memory allocation failure during task dispatching",
    [0xE4] = "NetworkClient: Disconnect received from server (Code 273)"
}

local function TriggerPanicTrap(code)
    local msg = FakeErrors[code] or "Fatal Engine Exception"
    local fakeTrace = _debug_traceback and _debug_traceback() or "Stack Offset 0x01"
    _xpcall(function() error("\\n[Roblox Engine Exception]: " .. msg .. "\\n" .. fakeTrace, 0) end, function(e) return e end)
end

local function StartVM()
    if _math_sin(os.time()) > 10.0 then TriggerPanicTrap(0xE1) return end

    local Op_GETGLOBAL = ${opcodes.GETGLOBAL}
    local Op_LOADK     = ${opcodes.LOADK}
    local Op_CALL      = ${opcodes.CALL}
    local Op_RETURN    = ${opcodes.RETURN}
    local Op_TRAP      = ${opcodes.TRAP}
    local Op_NOP       = ${opcodes.NOP}

    local RawPool = {${formattedConstants}}
    local ConstantsPool = {}
    for i = 1, #RawPool do
        ConstantsPool[i] = DecryptConst(RawPool[i])
    end

    local BytecodeStream = {
${formattedBytecode}
    }

    local Registers, IP, IsRunning = {}, 1, true
    while IsRunning and IP <= #BytecodeStream do
        local Inst = BytecodeStream[IP]
        local Opcode = Inst[1]

        if Opcode == Op_GETGLOBAL then
            Registers[Inst[2]] = _FETCH_ENV(ConstantsPool[Inst[3]])
        elseif Opcode == Op_LOADK then
            Registers[Inst[2]] = ConstantsPool[Inst[3]]
        elseif Opcode == Op_CALL then
            local targetReg, argRegisters = Inst[2], Inst[4]
            if #argRegisters == 3 and type(Registers[argRegisters[1]]) == "userdata" then
                local obj, method, url = Registers[argRegisters[1]], Registers[argRegisters[2]], Registers[argRegisters[3]]
                local ok, res = _pcall(function() return obj[method](obj, url) end)
                if ok then Registers[targetReg] = res else TriggerPanicTrap(0xE4) end
            else
                local func, p1 = Registers[argRegisters[1]], argRegisters[2] and Registers[argRegisters[2]]
                if type(func) == "function" then
                    local ok, res = _pcall(func, p1)
                    if ok then Registers[targetReg] = res else TriggerPanicTrap(0xE3) end
                elseif type(func) == "string" and _FETCH_ENV(func) then
                    Registers[targetReg] = _FETCH_ENV(func)(p1)
                else
                    TriggerPanicTrap(0xE2)
                end
            end
        elseif Opcode == Op_TRAP then
            TriggerPanicTrap(0xE2)
        elseif Opcode == Op_NOP then
        elseif Opcode == Op_RETURN then
            IsRunning = false
        end
        IP = IP + 1
    end
end

_task_spawn(function() _pcall(StartVM) end)`;

      outputEl.value = template;
      setStatus("已成功生成包含防解密/隐藏环境的高级 VM 混淆脚本！");
    }
  </script>
</body>
</html>
